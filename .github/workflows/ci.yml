name: EdgeSAR CI Pipeline

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, master]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scipy matplotlib Pillow scikit-learn pytest
      - name: Run Python test suite (23 tests)
        run: python -m pytest tests/ -v --tb=short
      - name: Run RDA Pipeline smoke test
        run: python run_rda.py --input synthetic --output-dir ./ci_output --snr 25.0
      - name: Run ATR dry-run
        run: python train.py --epochs 1 --dry-run
      - name: Verify WCET benchmark builds
        run: |
          cd modules/module3_embedded/stm32_port
          gcc -Wall -Wextra -pedantic -std=c99 -O2 -I../include -lm \
            -o benchmark_wcet src/benchmark_wcet.c ../src/fft_mock.c ../src/cfar_detector.c
          ./benchmark_wcet

  embedded-c-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gcc cppcheck
      - name: Compile with strict flags
        run: |
          cd modules/module3_embedded
          gcc -Wall -Wextra -pedantic -std=c99 -Werror -Wstrict-prototypes \
            -Wshadow -Iinclude -c src/cfar_detector.c src/hal_sar_mock.c src/fft_mock.c
      - name: Static analysis (cppcheck)
        run: |
          cd modules/module3_embedded
          cppcheck --enable=warning,style,performance,portability \
            --error-exitcode=1 -Iinclude src/
      - name: Build and run Unity tests
        run: |
          cd modules/module3_embedded
          gcc -Wall -Wextra -std=c99 -Iinclude -Itests/unity \
            src/*.c tests/*.c tests/unity/unity.c -lm -o test_runner
          ./test_runner
      - name: MISRA-C malloc/free audit
        run: |
          cd modules/module3_embedded
          if grep -rn 'malloc\|calloc\|realloc\|free(' src/ include/; then
            echo "FAIL: Dynamic memory allocation found!"
            exit 1
          fi
          echo "PASS: Zero dynamic memory allocation"

  data-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Verify MSTAR data hashes
        run: |
          echo "7691faebeac8f42a43376353441faeb5042bbfc28a6e6e2bf660aff0e3f5f5d7  data/mstar/train_cache.npz" | sha256sum -c
          echo "748e3658d22f44417f997674869c4500913a76158141ae69fbbc297976a0daad  data/mstar/test_cache.npz" | sha256sum -c
