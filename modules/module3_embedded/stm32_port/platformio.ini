; PlatformIO Project Configuration File for EdgeSAR Embedded Port
; Target: STM32F4-Discovery / STM32F407VG (ARM Cortex-M4F @ 168 MHz with hardware FPU)

[platformio]
default_envs = stm32f407_disco

[env:stm32f407_disco]
platform = ststm32
board = disco_f407vg
framework = stm32cube

build_flags =
    -Wall
    -Wextra
    -pedantic
    -std=c99
    -O2
    -DARM_MATH_CM4
    -D__FPU_PRESENT=1
    -DEDGESAR_STM32_PORT
    -I ../include

build_unflags =
    -Os

lib_deps =
    # CMSIS-DSP library for arm_cfft_f32 comparisons
    CMSIS-DSP

monitor_speed = 115200
